name: release-please

on:
  push:
    branches: [main]
  # Manual re-run of the publish job (e.g. if a release's publish failed).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  # Publishing happens when release-please has just cut a release (its release
  # PR was merged), or on a manual run. Auth is npm trusted publishing (OIDC):
  # no npm token is stored anywhere — npm verifies this repo + this workflow
  # file, configured on npmjs.com under the package's Settings → Trusted
  # publishers. Provenance is attached automatically. The package name comes
  # from package.json (autopilot-ai).
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1 (Node 22 ships npm 10).
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm and verify availability
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view --prefer-online "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm."
          else
            npm publish --access public
          fi

          for attempt in $(seq 1 30); do
            if npm view --prefer-online "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION is publicly available on npm."
              exit 0
            fi
            echo "Waiting for $NAME@$VERSION to become visible on npm (attempt $attempt/30)."
            sleep 10
          done

          echo "::error::$NAME@$VERSION was not publicly resolvable after publishing. npm may have staged the version without making it available; see npm/cli#9889."
          exit 1
