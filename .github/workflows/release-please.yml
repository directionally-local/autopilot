name: release-please

on:
  push:
    branches: [main]
  # Manual re-run of the publish job (e.g. if a release's publish failed).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A PR opened with the default GITHUB_TOKEN is treated as a first-time
      # contributor by this repo's approval policy, so CI on the release PR
      # sits at "action_required" until a human approves it (see PR #995).
      # A PAT makes the PR author a trusted collaborator, so CI runs on its own.
      - name: Warn when no release token is configured
        env:
          HAS_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' || secrets.DEPS_BOT_TOKEN != '' }}
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::No RELEASE_PLEASE_TOKEN or DEPS_BOT_TOKEN secret; release PRs will need manual CI approval."

      # Creating a GitHub release needs Contents: write. The bot PAT is scoped
      # to Pull requests: write (it only merges dependency PRs), so it cannot
      # create releases: doing both with it fails with "Resource not accessible
      # by personal access token" (run 40832224466). Split the two: the
      # workflow's own GITHUB_TOKEN creates the release, and the PAT only opens
      # the next release PR so CI runs on it without manual approval.
      - name: Create the release
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ github.token }}
          skip-github-pull-request: true

      - name: Open the next release PR
        uses: googleapis/release-please-action@v4
        id: pr
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.DEPS_BOT_TOKEN || github.token }}
          skip-github-release: true

  # Publishing happens when release-please has just cut a release (its release
  # PR was merged), or on a manual run. Auth is npm trusted publishing (OIDC):
  # no npm token is stored anywhere — npm verifies this repo + this workflow
  # file, configured on npmjs.com under the package's Settings → Trusted
  # publishers. Provenance is attached automatically. The package name comes
  # from package.json (autopilot-ai).
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1 (Node 22 ships npm 10).
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm and verify availability
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view --prefer-online "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm."
          else
            npm publish --access public
          fi

          # npm now processes new versions before serving them ("may take a few
          # minutes"); 2.6.2 took ~6.5 minutes. Wait up to 20 minutes.
          for attempt in $(seq 1 80); do
            if npm view --prefer-online "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION is publicly available on npm."
              exit 0
            fi
            echo "Waiting for $NAME@$VERSION to become visible on npm (attempt $attempt/80)."
            sleep 15
          done

          echo "::error::$NAME@$VERSION was not publicly resolvable after publishing. npm may have staged the version without making it available; see npm/cli#9889."
          exit 1
