name: Retire kimiflare (one-off)

# Publishes the final forwarding kimiflare release (deprecated/kimiflare). Run
# manually once, after autopilot-ai is on npm. Auth is npm trusted publishing
# (OIDC) — configure it on npmjs.com under kimiflare → Settings → Trusted
# publishers with this workflow file (retire-kimiflare.yml). Idempotent: skips
# if that kimiflare version is already out.
#
# Deprecating kimiflare is not something OIDC can do; do it once on npmjs.com
# (kimiflare → Settings → Deprecate package) with the message:
#   kimiflare has been renamed to autopilot. Install: npm i -g autopilot-ai (command: autopilot)

on:
  workflow_dispatch:

jobs:
  retire:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1 (Node 22 ships npm 10).
      - name: Update npm
        run: npm install -g npm@latest

      - name: Require autopilot-ai on npm first
        run: npm view autopilot-ai version

      - name: Publish final kimiflare (forwards to autopilot-ai)
        working-directory: deprecated/kimiflare
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          if npm view "kimiflare@$LOCAL" version >/dev/null 2>&1; then
            echo "kimiflare@$LOCAL already on npm; skipping publish."
          else
            npm publish --access public
          fi
